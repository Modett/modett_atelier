services:
  db:
    image: postgres:17
    container_name: modett-db
    environment:
      POSTGRES_PASSWORD: modett
      POSTGRES_DB: modett
      POSTGRES_USER: postgres
    ports:
      - "5433:5432"
    volumes:
      - modett_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d modett"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: modett-redis
    ports:
      - "6379:6379"
    volumes:
      - modett_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  modett_db:
  modett_redis: